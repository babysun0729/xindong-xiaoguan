[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

# API 路由转发到 Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# SPA 回退：非静态文件路径返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
