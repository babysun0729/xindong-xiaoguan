services:
  - type: web
    name: xindong-xiaoguan
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: xindong-db
          property: connectionString
  - type: psdb
    name: xindong-db
    plan: free
